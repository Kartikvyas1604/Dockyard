<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Dockyard crane mark">
  <!-- Brass Lantern tile -->
  <rect width="64" height="64" rx="10" fill="#0a0a0a"/>
  <rect x="1" y="1" width="62" height="62" rx="9" fill="none" stroke="#1f1f1f" stroke-width="2"/>

  <g stroke="#f5a524" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- mast -->
    <path d="M20 52 V 14"/>
    <!-- jib -->
    <path d="M14 14 H 46"/>
    <!-- tie-back -->
    <path d="M20 14 L 34 8" stroke-width="2.5"/>
    <!-- trolley drop -->
    <path d="M42 14 V 26" stroke-width="3"/>
    <!-- hook -->
    <path d="M42 26 v 3 a 4 4 0 1 1 -4 4" stroke-width="3"/>
  </g>

  <!-- container: the strategy in transit -->
  <rect x="33" y="42" width="18" height="12" rx="1.5" fill="none" stroke="#ececec" stroke-width="2.5"/>
  <path d="M33 48 H 51" stroke="#1f1f1f" stroke-width="2"/>

  <!-- waterline -->
  <path d="M10 58 H 54" stroke="#2e2e2e" stroke-width="2.5" stroke-linecap="round"/>
</svg>
